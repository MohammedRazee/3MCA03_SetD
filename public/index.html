<!DOCTYPE html>
<!-- DO NOT EDIT THIS FILE. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket League Players</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cricket League Players</h1>
    <p>CA Lab Exam &middot; Section 3MCA03 &middot; Set D</p>
  </header>

  <main>
    <div class="controls">
      <section class="panel">
        <h2>Quick views</h2>
        <div class="actions">
          <button id="show-all" type="button">Show All Players</button>
          <button id="top-three" type="button">Top 3 Run Scorers</button>
        </div>
      </section>

      <section class="panel">
        <h2>Search by team</h2>
        <form id="search-form" class="inline">
          <select name="team" required>
            <option value="">Choose a team...</option>
            <option value="Tigers">Tigers</option>
            <option value="Eagles">Eagles</option>
            <option value="Lions">Lions</option>
          </select>
          <button type="submit">Search</button>
        </form>
      </section>

      <section class="panel">
        <h2>Filter</h2>
        <form id="filter-form" class="inline">
          <label>Runs at least
            <input type="number" name="minRuns" step="1" required>
          </label>
          <button type="submit">Filter</button>
        </form>
      </section>

      <section class="panel">
        <h2>Add Player</h2>
        <form id="add-form" class="stack">
        <label>Name
          <input type="text" name="name" required>
        </label>
        <label>Team
          <select name="team" required>
            <option value="">Choose...</option>
            <option value="Tigers">Tigers</option>
            <option value="Eagles">Eagles</option>
            <option value="Lions">Lions</option>
          </select>
        </label>
        <label>Role
          <input type="text" name="role" required>
        </label>
        <label>Runs
          <input type="number" name="runs" step="1" required>
        </label>
          <button type="submit">Add Player</button>
        </form>
        <p id="add-status" class="status"></p>
      </section>
    </div>

    <section class="panel results">
      <h2 id="result-title">Results</h2>
      <div id="result"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
